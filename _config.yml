###########################################################
### Allison Matthews | PhD -- site configuration
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Allison Matthews | PhD

# Your name to show in the footer
author: Allison Matthews

# Short description of your site
description: Astronomer & Assistant Professor, University of Colorado Boulder

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Publications: "https://ui.adsabs.harvard.edu/public-libraries/tntUYs33QR-B2rjyrzUSbw"
  CV: "cv"
  Resources:
    - UNIX tutorial: "memyshellandi"
    - Astro Activities: "astroactivities"
    - Radio Astronomy Resources: "radioresources"
  Outreach: "outreach"
  # Teaching: "teaching"   # uncomment when ready to publish the Teaching page

################
# --- Logo --- #
################

# Image to show in the navigation bar - works best with a square image
avatar: "/assets/img/logo2.png"

# By default, the image is cut into a circle. You can disable this behaviour by setting 'round-avatar: false'
round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  rss: false
  email: amatthews@carnegiescience.edu
  github: allison-matthews
  linkedin: allison-matthews-9a86b8222

###########################
# --- General options --- #
###########################

# How to display the link to your website in the footer
#url-pretty: "allison-matthews.com"

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt word length
excerpt_length: 50

# Whether or not to show an excerpt for every blog post in the feed page
feed_show_excerpt: true

# Whether or not to show a list of tags below each post preview in the feed page
feed_show_tags: false

# Add a search button to the navbar
post_search: false

# Add a button in the footer to edit the current page. Only works if your website is hosted on GitHub
edit_page_button: false

# Allow sub-menu items (second-level navigation menu items) to be longer than the top-level menu
navbar-var-length: false

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#3b6d11"
hover-col: "#27500a"
navbar-col: "#282a36"
navbar-text-col: "#F5F5F5"
navbar-border-col: "#1a1b23"
footer-col: "#F5F5F5"
footer-text-col: "#777777"
footer-link-col: "#3b6d11"
footer-hover-col: "#27500a"

# For any extra visual customization, include additional CSS files here
site-css:
  - "/assets/css/custom.css"

#################################
# --- Web Analytics Section --- #
#################################

# (none currently configured)

####################
# --- Comments --- #
####################

# (none currently configured)

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "America/Vancouver"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

